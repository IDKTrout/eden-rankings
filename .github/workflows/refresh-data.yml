# Downloads the published rankings sheet and commits any changes to src/data/.
# Each commit makes Cloudflare rebuild event-rankings.edenafk.com with the new data.
name: Refresh sheet data

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch: {}      # "Run workflow" button on GitHub, for an immediate update

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Download sheet data
        run: node scripts/fetch-data.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/data; then
            echo "Sheet data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Refresh rankings data from the sheet"
          git push
