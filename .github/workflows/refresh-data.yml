# Downloads the rankings from the Supabase database and commits any changes to src/data/.
# Each commit makes Cloudflare rebuild event-rankings.edenafk.com with the new data,
# so edits made in the admin area appear on the site within about 15-20 minutes.
name: Refresh rankings data

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: {}      # "Run workflow" button on GitHub, for an immediate update

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Download database data
        run: node scripts/fetch-data.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/data; then
            echo "Data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Refresh rankings data from the database"
          git push
